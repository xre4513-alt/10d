name: Build 10D Audio APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-licenses: 'true'

      - name: ⚙️ Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: 📂 Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/akash/audio10d
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

      - name: 🖼️ Copy Logo (from repo root)
        run: |
          if [ -f logo.png ]; then
            cp logo.png app/src/main/res/drawable/logo.png
            cp logo.png app/src/main/assets/logo.png
            echo "✅ Custom logo.png found and copied"
          else
            cat > app/src/main/res/drawable/logo.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#7c3aed"/>
              <corners android:radius="12dp"/>
          </shape>
          EOF
            echo "⚠️ No logo.png found — using fallback"
          fi

      - name: 📝 Write settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "10D Audio"
          include ':app'
          EOF

      - name: 📝 Write root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

      - name: 📝 Write gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.enableJetifier=true
          EOF

      - name: 📝 Write app/build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.akash.audio10d'
              compileSdk 34

              defaultConfig {
                  applicationId "com.akash.audio10d"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.9.0'
          }
          EOF

      - name: 📝 Write proguard-rules.pro
        run: |
          echo "# Empty proguard rules" > app/proguard-rules.pro

      - name: 📝 Write AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/logo"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: 📝 Write strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">10D Audio</string>
          </resources>
          EOF

      - name: 📝 Write styles.xml
        run: |
          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

      - name: 📝 Write MainActivity.java
        run: |
          cat > app/src/main/java/com/akash/audio10d/MainActivity.java << 'EOF'
          package com.akash.audio10d;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.content.ContentUris;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.util.Base64;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.content.ContextCompat;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private ActivityResultLauncher<Intent> fileChooserLauncher;
              private ActivityResultLauncher<String> permissionLauncher;

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  );

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      getWindow().setStatusBarColor(0xFF000000);
                      getWindow().setNavigationBarColor(0xFF000000);
                  }

                  permissionLauncher = registerForActivityResult(
                      new ActivityResultContracts.RequestPermission(),
                      granted -> {
                          webView.evaluateJavascript(
                              granted
                                  ? "window.onStoragePermissionGranted && window.onStoragePermissionGranted();"
                                  : "window.onStoragePermissionDenied && window.onStoragePermissionDenied();",
                              null);
                      });

                  fileChooserLauncher = registerForActivityResult(
                      new ActivityResultContracts.StartActivityForResult(),
                      result -> {
                          if (filePathCallback == null) return;
                          Uri[] results = null;
                          if (result.getResultCode() == RESULT_OK && result.getData() != null) {
                              Intent data = result.getData();
                              if (data.getClipData() != null) {
                                  int count = data.getClipData().getItemCount();
                                  results = new Uri[count];
                                  for (int i = 0; i < count; i++) {
                                      results[i] = data.getClipData().getItemAt(i).getUri();
                                  }
                              } else if (data.getData() != null) {
                                  results = new Uri[]{ data.getData() };
                              }
                          }
                          filePathCallback.onReceiveValue(results);
                          filePathCallback = null;
                      });

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.JELLY_BEAN) {
                      s.setAllowFileAccessFromFileURLs(true);
                      s.setAllowUniversalAccessFromFileURLs(true);
                  }

                  webView.addJavascriptInterface(new WebAppBridge(), "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                              request.grant(request.getResources());
                          }
                      }

                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {
                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }
                          MainActivity.this.filePathCallback = filePathCallback;
                          Intent intent = fileChooserParams.createIntent();
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          try {
                              fileChooserLauncher.launch(intent);
                          } catch (Exception e) {
                              MainActivity.this.filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class WebAppBridge {

                  @JavascriptInterface
                  public boolean hasStoragePermission() {
                      String perm = Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU
                          ? Manifest.permission.READ_MEDIA_AUDIO
                          : Manifest.permission.READ_EXTERNAL_STORAGE;
                      return ContextCompat.checkSelfPermission(MainActivity.this, perm)
                          == PackageManager.PERMISSION_GRANTED;
                  }

                  @JavascriptInterface
                  public void requestStoragePermission() {
                      runOnUiThread(() -> {
                          String perm = Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU
                              ? Manifest.permission.READ_MEDIA_AUDIO
                              : Manifest.permission.READ_EXTERNAL_STORAGE;
                          permissionLauncher.launch(perm);
                      });
                  }

                  @JavascriptInterface
                  public void openAppSettings() {
                      runOnUiThread(() -> {
                          Intent intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                          intent.setData(Uri.parse("package:" + getPackageName()));
                          try { startActivity(intent); } catch (Exception e) { e.printStackTrace(); }
                      });
                  }

                  @JavascriptInterface
                  public String getAudioFiles() {
                      JSONArray arr = new JSONArray();
                      try {
                          Uri collection;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              collection = MediaStore.Audio.Media.getContentUri(MediaStore.VOLUME_EXTERNAL);
                          } else {
                              collection = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI;
                          }

                          String[] projection = {
                              MediaStore.Audio.Media._ID,
                              MediaStore.Audio.Media.TITLE,
                              MediaStore.Audio.Media.DISPLAY_NAME,
                              MediaStore.Audio.Media.DURATION,
                              MediaStore.Audio.Media.SIZE,
                              MediaStore.Audio.Media.ARTIST,
                              MediaStore.Audio.Media.ALBUM
                          };

                          String selection = MediaStore.Audio.Media.IS_MUSIC + " != 0";
                          String sortOrder = MediaStore.Audio.Media.TITLE + " ASC";

                          Cursor cursor = getContentResolver().query(
                              collection, projection, selection, null, sortOrder);

                          if (cursor != null) {
                              int idCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media._ID);
                              int titleCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE);
                              int nameCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.DISPLAY_NAME);
                              int durCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION);
                              int sizeCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.SIZE);
                              int artistCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST);
                              int albumCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM);

                              while (cursor.moveToNext()) {
                                  long id = cursor.getLong(idCol);
                                  Uri contentUri = ContentUris.withAppendedId(collection, id);

                                  JSONObject obj = new JSONObject();
                                  obj.put("id", id);
                                  obj.put("uri", contentUri.toString());
                                  obj.put("title", safeStr(cursor.getString(titleCol)));
                                  obj.put("name", safeStr(cursor.getString(nameCol)));
                                  obj.put("duration", cursor.getLong(durCol));
                                  obj.put("size", cursor.getLong(sizeCol));
                                  obj.put("artist", safeStr(cursor.getString(artistCol)));
                                  obj.put("album", safeStr(cursor.getString(albumCol)));
                                  arr.put(obj);
                              }
                              cursor.close();
                          }
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                      return arr.toString();
                  }

                  @JavascriptInterface
                  public String getAudioData(String uriStr) {
                      try {
                          Uri uri = Uri.parse(uriStr);
                          InputStream is = getContentResolver().openInputStream(uri);
                          if (is == null) return "";
                          ByteArrayOutputStream baos = new ByteArrayOutputStream();
                          byte[] buf = new byte[16384];
                          int n;
                          while ((n = is.read(buf)) != -1) baos.write(buf, 0, n);
                          is.close();
                          return Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  private String safeStr(String s) { return s == null ? "" : s; }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: 📝 Write index.html (Full 10D App + Custom Picker)
        run: |
          cat > app/src/main/assets/index.html << 'HTML_CONTENT_EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
          <title>10D Audio Studio</title>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js" defer></script>
          <style>
          *{box-sizing:border-box}
          :root{--bg-1:#020b1a;--accent:#7c3aed;--accent-2:#a78bfa;
          --accent-glow:rgba(124,58,237,.35);--muted:#8ba3c7;--card-bg:rgba(255,255,255,.025);
          --border:rgba(255,255,255,.04);--radius:14px;
          --font:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif}
          html{font-size:15px}
          body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 30% 20%,#0b1a33,var(--bg-1) 80%);
          font-family:var(--font);color:#eaf3ff;display:flex;align-items:center;justify-content:center;padding:18px}
          .app{width:1040px;max-width:100%;border-radius:var(--radius);padding:20px 22px 14px;
          background:rgba(0,0,0,.45);backdrop-filter:blur(2px);border:1px solid var(--border);
          box-shadow:0 20px 60px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.02)}
          header{display:flex;gap:14px;align-items:center;justify-content:space-between;
          margin-bottom:14px;flex-wrap:wrap}
          .logo-group{display:flex;align-items:center;gap:12px}
          .logo{width:46px;height:46px;border-radius:12px;
          background:linear-gradient(145deg,var(--accent),var(--accent-2));display:grid;place-items:center;
          font-weight:800;font-size:19px;color:#fff;box-shadow:0 6px 22px var(--accent-glow);overflow:hidden}
          .logo img{width:100%;height:100%;object-fit:cover;display:none}
          .title-group h1{margin:0;font-size:19px;font-weight:700}
          .title-group .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
          .badge{font-size:12px;background:rgba(124,58,237,.18);padding:4px 14px;border-radius:40px;
          border:1px solid rgba(124,58,237,.15);color:var(--accent-2)}
          .main-grid{display:grid;grid-template-columns:1fr 340px;gap:18px}
          @media(max-width:820px){.main-grid{grid-template-columns:1fr}}
          .card{background:var(--card-bg);border-radius:var(--radius);padding:16px 18px;
          border:1px solid var(--border)}
          .card-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;
          margin:0 0 10px 0}
          .canvas-wrap{position:relative;border-radius:12px;overflow:hidden;
          background:radial-gradient(ellipse at center,#051828,#01080f);border:1px solid var(--border)}
          #vis{display:block;width:100%;height:260px;cursor:crosshair}
          .control-group{display:flex;flex-direction:column;gap:6px}
          .control-row{display:flex;align-items:center;gap:10px}
          .control-row label{font-size:12.5px;color:var(--muted);min-width:56px}
          .control-row input[type="range"]{flex:1;height:4px;-webkit-appearance:none;
          background:rgba(255,255,255,.08);border-radius:4px;outline:none}
          .control-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;
          width:16px;height:16px;border-radius:50%;
          background:linear-gradient(145deg,var(--accent),var(--accent-2));cursor:pointer;
          box-shadow:0 0 14px var(--accent-glow);border:2px solid rgba(255,255,255,.1)}
          .val{min-width:44px;text-align:right;font-size:13px;color:var(--muted)}
          .file-wrap{position:relative;margin-bottom:8px}
          .btn-browse{width:100%;padding:12px;border-radius:10px;
          background:linear-gradient(145deg,rgba(124,58,237,.25),rgba(167,139,250,.15));
          border:1.5px dashed rgba(124,58,237,.4);color:#fff;font-weight:600;font-size:13px;
          cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px}
          .btn-browse:hover{background:linear-gradient(145deg,rgba(124,58,237,.35),rgba(167,139,250,.2));
          border-color:rgba(124,58,237,.6)}
          .btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
          button{border:0;border-radius:10px;padding:9px 18px;font-weight:700;font-size:13px;
          cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;
          font-family:var(--font)}
          .btn-primary{background:linear-gradient(145deg,var(--accent),var(--accent-2));color:#fff;
          box-shadow:0 4px 18px var(--accent-glow)}
          .btn-ghost{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted)}
          .btn-success{background:linear-gradient(145deg,#0ea5e9,#22d3ee);color:#001a1f}
          .custom-toggle{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.2);
          padding:8px 14px;border-radius:40px;border:1px solid var(--border);margin-bottom:6px;flex-wrap:wrap}
          .custom-toggle .label{font-size:13px;color:var(--muted)}
          .toggle-track{width:44px;height:24px;background:rgba(255,255,255,.08);border-radius:40px;
          cursor:pointer;position:relative;transition:.3s;flex-shrink:0}
          .toggle-track.active{background:var(--accent);box-shadow:0 0 20px var(--accent-glow)}
          .toggle-track .thumb{width:18px;height:18px;background:#fff;border-radius:50%;
          position:absolute;top:2px;left:2px;transition:.3s cubic-bezier(.34,1.56,.64,1)}
          .toggle-track.active .thumb{left:22px}
          .custom-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 12px;
          padding-top:6px;border-top:1px solid var(--border);margin-top:6px}
          .custom-controls .ctrl{display:flex;flex-direction:column;gap:2px}
          .custom-controls .ctrl label{font-size:11px;color:var(--muted)}
          .custom-controls .ctrl input[type="range"]{width:100%;height:3px;-webkit-appearance:none;
          background:rgba(255,255,255,.06);border-radius:4px;outline:none}
          .custom-controls .ctrl input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;
          width:14px;height:14px;border-radius:50%;background:var(--accent-2);cursor:pointer}
          .custom-controls .ctrl .cval{font-size:12px;color:var(--muted);text-align:center}
          #status{font-size:13px;color:var(--muted);padding:8px 12px;background:rgba(0,0,0,.2);
          border-radius:10px;border:1px solid var(--border);margin-top:6px;white-space:pre-wrap;
          min-height:38px;display:flex;align-items:center}
          #player{width:100%;margin-top:8px;border-radius:8px;background:rgba(0,0,0,.3);height:40px}
          .download-area{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
          .download-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;
          background:linear-gradient(145deg,#0ea5e9,#22d3ee);color:#001a1f;border-radius:10px;
          text-decoration:none;font-weight:700;font-size:13px}
          footer{text-align:center;color:var(--muted);font-size:12px;margin-top:14px;opacity:.5}
          .tips{font-size:13px;color:var(--muted);line-height:1.6}
          .tips ul{margin:4px 0 0 0;padding-left:18px}
          .tips .highlight{color:var(--accent-2);font-weight:600}

          /* ═══════════ AUDIO PICKER MODAL ═══════════ */
          #pickerModal{position:fixed;inset:0;z-index:99999;display:none;
          align-items:center;justify-content:center}
          #pickerModal.show{display:flex}
          .picker-overlay{position:absolute;inset:0;background:rgba(0,0,0,.8);
          backdrop-filter:blur(8px)}
          .picker-panel{position:relative;width:94%;max-width:580px;max-height:82vh;
          background:linear-gradient(180deg,#0a1424,#061020);
          border:1px solid rgba(255,255,255,.08);border-radius:16px;
          display:flex;flex-direction:column;overflow:hidden;
          box-shadow:0 20px 80px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.04);
          animation:pickerIn .25s cubic-bezier(.34,1.56,.64,1)}
          @keyframes pickerIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
          .picker-top{display:flex;justify-content:space-between;align-items:center;
          padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.05)}
          .picker-title{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
          .picker-x{background:transparent;border:0;color:var(--muted);font-size:18px;
          cursor:pointer;padding:4px 10px;border-radius:8px;transition:.2s}
          .picker-x:hover{background:rgba(255,255,255,.06);color:#fff}
          .picker-search-row{display:flex;gap:8px;padding:12px 16px;
          border-bottom:1px solid rgba(255,255,255,.05)}
          .picker-search-row input{flex:1;padding:11px 14px;border-radius:10px;
          border:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.5);
          color:#fff;font-size:13px;outline:none;font-family:var(--font);transition:.2s}
          .picker-search-row input:focus{border-color:var(--accent);
          box-shadow:0 0 0 3px rgba(124,58,237,.15)}
          .picker-search-row input::placeholder{color:rgba(139,163,199,.5)}
          .picker-search-row button{padding:10px 16px;font-size:13px;border-radius:10px}
          .picker-list{flex:1;overflow-y:auto;padding:4px 0;min-height:200px}
          .picker-list::-webkit-scrollbar{width:6px}
          .picker-list::-webkit-scrollbar-thumb{background:rgba(124,58,237,.4);border-radius:10px}
          .picker-list::-webkit-scrollbar-track{background:transparent}
          .picker-item{display:flex;align-items:center;gap:12px;padding:11px 18px;
          cursor:pointer;transition:.12s;border-bottom:1px solid rgba(255,255,255,.02)}
          .picker-item:hover{background:rgba(124,58,237,.14)}
          .picker-item:active{background:rgba(124,58,237,.28);transform:scale(.99)}
          .picker-item-icon{width:42px;height:42px;border-radius:10px;
          background:linear-gradient(145deg,var(--accent),var(--accent-2));
          display:grid;place-items:center;font-size:18px;flex-shrink:0;
          box-shadow:0 2px 10px rgba(124,58,237,.3)}
          .picker-item-info{flex:1;min-width:0}
          .picker-item-name{font-size:13.5px;font-weight:600;white-space:nowrap;
          overflow:hidden;text-overflow:ellipsis;color:#fff}
          .picker-item-meta{font-size:11.5px;color:var(--muted);white-space:nowrap;
          overflow:hidden;text-overflow:ellipsis;margin-top:3px}
          .picker-item-meta .dur{color:var(--accent-2);font-weight:600}
          .picker-bottom{display:flex;justify-content:space-between;align-items:center;
          padding:12px 18px;border-top:1px solid rgba(255,255,255,.05);
          font-size:12px;color:var(--muted);gap:10px;flex-wrap:wrap}
          .picker-link{background:transparent;border:0;color:var(--accent-2);cursor:pointer;
          font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;transition:.2s}
          .picker-link:hover{background:rgba(124,58,237,.15)}
          .picker-empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px}
          .picker-empty .emoji{font-size:32px;display:block;margin-bottom:10px;opacity:.6}
          @media(max-width:600px){
              body{padding:8px}
              .app{padding:14px 14px 10px}
              .picker-panel{width:100%;max-width:100%;height:100%;max-height:100%;border-radius:0}
              .main-grid{gap:12px}
              #vis{height:200px}
          }
          </style>
          </head>
          <body>
          <div class="app">
          <header>
            <div class="logo-group">
              <div class="logo">
                <img id="logoImg" src="logo.png" alt="" style="display:none;width:100%;height:100%;object-fit:cover" />
                <span id="logoText">10D</span>
              </div>
              <div class="title-group">
                <h1>10D Audio Studio</h1>
                <div class="sub">Binaural · HRTF · High-Quality</div>
              </div>
            </div>
            <div class="badge">🎧 headphones required</div>
          </header>
          <div class="main-grid">
            <div>
              <div class="canvas-wrap"><canvas id="vis"></canvas></div>
              <div class="card" style="margin-top:12px">
                <div class="file-wrap">
                  <input id="file" type="file" accept="audio/*" style="display:none" />
                  <button id="openPickerBtn" class="btn-browse">📁 Select Audio File</button>
                </div>
                <div class="control-group">
                  <div class="control-row"><label>Speed</label>
                  <input id="speed" type="range" min="0.1" max="2.5" step="0.01" value="0.7" />
                  <div class="val" id="speedVal">0.70×</div></div>
                  <div class="control-row"><label>Depth</label>
                  <input id="depth" type="range" min="0.1" max="2.0" step="0.01" value="1.0" />
                  <div class="val" id="depthVal">1.00</div></div>
                  <div class="control-row"><label>Widen</label>
                  <input id="widen" type="range" min="0" max="1" step="0.01" value="0.35" />
                  <div class="val" id="widenVal">0.35</div></div>
                  <div class="control-row"><label>Reverb</label>
                  <input id="reverb" type="range" min="0" max="1" step="0.01" value="0.22" />
                  <div class="val" id="reverbVal">0.22</div></div>
                </div>
                <div class="custom-toggle">
                  <span class="label">🎯 Custom Mode</span>
                  <div class="toggle-track" id="customToggle"><div class="thumb"></div></div>
                  <span style="font-size:12px;color:var(--muted);" id="customStatus">off</span>
                </div>
                <div id="customControls" style="display:none;">
                  <div class="custom-controls">
                    <div class="ctrl"><label>Azimuth °</label>
                    <input id="azimuth" type="range" min="-180" max="180" value="0" step="1" />
                    <div class="cval" id="azimuthVal">0°</div></div>
                    <div class="ctrl"><label>Elevation °</label>
                    <input id="elevation" type="range" min="-60" max="60" value="0" step="1" />
                    <div class="cval" id="elevationVal">0°</div></div>
                    <div class="ctrl"><label>Distance</label>
                    <input id="distance" type="range" min="0.1" max="2.5" value="1.0" step="0.05" />
                    <div class="cval" id="distanceVal">1.00</div></div>
                  </div>
                </div>
                <div class="btn-group">
                  <button id="previewBtn" class="btn-primary">▶ Preview</button>
                  <button id="stopBtn" class="btn-ghost">⏹ Stop</button>
                  <button id="renderBtn" class="btn-success">💾 Render</button>
                </div>
                <audio id="player" controls></audio>
                <div id="status">Status: ready</div>
                <div class="download-area" id="downloadArea"></div>
              </div>
            </div>
            <div class="card">
              <div class="card-title">⚡ Studio Tips</div>
              <div class="tips">
                <ul>
                  <li>Upload any audio file</li>
                  <li><span class="highlight">Custom Mode</span> — manual position</li>
                  <li>Click canvas to set position</li>
                  <li>Render exports <span class="highlight">320kbps MP3</span></li>
                  <li style="margin-top:8px;opacity:.6;">Made by AKASH · 10D v2</li>
                </ul>
              </div>
            </div>
          </div>
          <footer>© 10D Audio Tool — binaural spatial audio</footer>
          </div>

          <!-- ═══════════ AUDIO PICKER MODAL ═══════════ -->
          <div id="pickerModal">
            <div class="picker-overlay" id="pickerOverlay"></div>
            <div class="picker-panel">
              <div class="picker-top">
                <div class="picker-title">🎵 Select Audio</div>
                <button class="picker-x" id="pickerClose">✕</button>
              </div>
              <div class="picker-search-row">
                <input type="text" id="pickerSearch" placeholder="Search songs, artists, albums..." autocomplete="off" />
                <button id="pickerSearchBtn" class="btn-primary">🔍</button>
              </div>
              <div class="picker-list" id="pickerList">
                <div class="picker-empty"><span class="emoji">🎧</span>Scanning device...</div>
              </div>
              <div class="picker-bottom">
                <span id="pickerCount">0 songs</span>
                <button class="picker-link" id="pickerSystem">Use system picker →</button>
              </div>
            </div>
          </div>

          <script>
          const $=id=>document.getElementById(id);
          const fileEl=$('file'),player=$('player'),statusEl=$('status');
          const speedEl=$('speed'),depthEl=$('depth'),widenEl=$('widen'),reverbEl=$('reverb');
          const speedVal=$('speedVal'),depthVal=$('depthVal'),widenVal=$('widenVal'),reverbVal=$('reverbVal');
          const vis=$('vis'),downloadArea=$('downloadArea');
          const customToggle=$('customToggle'),customStatus=$('customStatus'),customControls=$('customControls');
          const azimuthEl=$('azimuth'),elevationEl=$('elevation'),distanceEl=$('distance');
          const azimuthVal=$('azimuthVal'),elevationVal=$('elevationVal'),distanceVal=$('distanceVal');
          const pickerModal=$('pickerModal'),pickerList=$('pickerList'),pickerSearch=$('pickerSearch');
          const pickerCount=$('pickerCount'),pickerSearchBtn=$('pickerSearchBtn');
          const pickerClose=$('pickerClose'),pickerOverlay=$('pickerOverlay');
          const openPickerBtn=$('openPickerBtn'),pickerSystem=$('pickerSystem');
          const logoImg=$('logoImg'),logoText=$('logoText');

          let buffer=null,liveCtx=null,src=null,pan=null,anim=null,isCustom=false,isPlaying=false;

          // Picker state
          let allSongs=[];
          let pickerScrollTop=0;
          let pickerInitialized=false;

          // Logo handling
          logoImg.onload=function(){logoImg.style.display='block';logoText.style.display='none';};
          logoImg.onerror=function(){logoImg.remove();};

          function status(s){statusEl.textContent='Status: '+s;}
          function updateVals(){
            speedVal.textContent=Number(speedEl.value).toFixed(2)+'×';
            depthVal.textContent=Number(depthEl.value).toFixed(2);
            widenVal.textContent=Number(widenEl.value).toFixed(2);
            reverbVal.textContent=Number(reverbEl.value).toFixed(2);
          }
          speedEl.oninput=depthEl.oninput=widenEl.oninput=reverbEl.oninput=updateVals;updateVals();
          function updateCustomVals(){
            azimuthVal.textContent=Number(azimuthEl.value).toFixed(0)+'°';
            elevationVal.textContent=Number(elevationEl.value).toFixed(0)+'°';
            distanceVal.textContent=Number(distanceEl.value).toFixed(2);
          }
          azimuthEl.oninput=elevationEl.oninput=distanceEl.oninput=updateCustomVals;updateCustomVals();
          customToggle.addEventListener('click',()=>{
            isCustom=!isCustom;
            customToggle.classList.toggle('active',isCustom);
            customStatus.textContent=isCustom?'on':'off';
            customControls.style.display=isCustom?'block':'none';
            if(isPlaying&&pan)updatePanFromCustom();
          });
          function sph(az,el,d){const A=az*Math.PI/180,E=el*Math.PI/180;
            return{x:d*Math.cos(E)*Math.sin(A),y:d*Math.sin(E),z:d*Math.cos(E)*Math.cos(A)};}
          const ctx=vis.getContext('2d');let W,H,dpr;
          function resize(){const r=vis.getBoundingClientRect();dpr=devicePixelRatio||1;
            W=r.width;H=r.height;vis.width=W*dpr;vis.height=H*dpr;
            ctx.setTransform(dpr,0,0,dpr,0,0);drawBG();}
          window.addEventListener('resize',resize);
          function drawBG(){ctx.fillStyle='#01080f';ctx.fillRect(0,0,W,H);
            ctx.strokeStyle='rgba(255,255,255,.02)';ctx.lineWidth=0.5;
            for(let i=0;i<10;i++){const x=(i/10)*W;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
              const y=(i/10)*H;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
            ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;ctx.setLineDash([4,6]);
            ctx.beginPath();ctx.arc(W/2,H/2,Math.min(W,H)*0.28,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}
          function proj(p){const s=Math.min(W,H)*0.55;
            return{x:W/2+p.x*s,y:H/2-p.y*s*0.85-p.z*12,r:5+(1-Math.min(1,p.z*0.5))*7};}
          function drawDot(p,color){const d=proj(p);
            const grad=ctx.createRadialGradient(d.x-3,d.y-3,2,d.x,d.y,d.r+10);
            grad.addColorStop(0,color||'#a78bfa');grad.addColorStop(0.7,color||'#7c3aed');
            grad.addColorStop(1,'rgba(124,58,237,0)');
            ctx.shadowColor='rgba(124,58,237,.4)';ctx.shadowBlur=28;
            ctx.beginPath();ctx.arc(d.x,d.y,d.r+6,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();
            ctx.shadowBlur=0;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();}
          function drawPosition(p,color){drawBG();drawDot(p,color);}
          resize();
          vis.addEventListener('click',(e)=>{
            if(!isCustom||!isPlaying)return;
            const r=vis.getBoundingClientRect();
            const mx=(e.clientX-r.left)/W*2-1,my=-(e.clientY-r.top)/H*2+1;
            const az=Math.max(-180,Math.min(180,mx*180));
            const el=Math.max(-60,Math.min(60,my*60));
            azimuthEl.value=az;elevationEl.value=el;updateCustomVals();updatePanFromCustom();
            const p=getCustomPosition();drawPosition(p,'#60a5fa');
          });
          function getCustomPosition(){return sph(Number(azimuthEl.value),Number(elevationEl.value),Number(distanceEl.value));}
          function updatePanFromCustom(){if(!pan)return;const p=getCustomPosition();
            if('positionX'in pan){pan.positionX.value=p.x;pan.positionY.value=p.y;pan.positionZ.value=p.z;}
            drawPosition(p,'#60a5fa');}

          // ═══════════ LOAD FROM URI ═══════════
          async function loadAudioFromUri(uri, displayName){
            try{
              status('Loading audio…');
              let arrayBuffer;
              // Try direct fetch first (fast path for content://)
              try{
                const resp=await fetch(uri);
                if(resp.ok){arrayBuffer=await resp.arrayBuffer();}
                else throw new Error('fetch status '+resp.status);
              }catch(fe){
                // Fallback: base64 from native
                if(window.AndroidBridge){
                  const b64=AndroidBridge.getAudioData(uri);
                  if(!b64)throw new Error('Empty data');
                  const bin=atob(b64);
                  const bytes=new Uint8Array(bin.length);
                  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
                  arrayBuffer=bytes.buffer;
                }else{
                  throw fe;
                }
              }
              const c=new (window.AudioContext||window.webkitAudioContext)({sampleRate:48000});
              buffer=await c.decodeAudioData(arrayBuffer.slice(0));
              await c.close();
              const blob=new Blob([arrayBuffer],{type:'audio/mpeg'});
              player.src=URL.createObjectURL(blob);
              status('✅ Loaded: '+(displayName||'audio')+'  ·  '+buffer.duration.toFixed(1)+'s');
            }catch(err){
              status('Load error: '+err.message);
            }
          }

          // ═══════════ FILE INPUT (system fallback) ═══════════
          fileEl.onchange=async e=>{
            const f=e.target.files[0];if(!f)return;status('Decoding …');
            try{const ab=await f.arrayBuffer();
              const c=new (window.AudioContext||window.webkitAudioContext)({sampleRate:48000});
              buffer=await c.decodeAudioData(ab.slice(0));await c.close();
              player.src=URL.createObjectURL(f);
              status('Loaded: '+f.name+' | '+buffer.duration.toFixed(1)+'s');
            }catch(err){status('Decode error: '+err.message);}
          };

          function makeImpulse(c,dur=2.4,decay=2.8){const sr=c.sampleRate||48000;
            const len=Math.floor(sr*dur),buf=c.createBuffer(2,len,sr);
            for(let ch=0;ch<2;ch++){const data=buf.getChannelData(ch);
              for(let i=0;i<len;i++){const t=i/sr,env=Math.pow(1-t/dur,decay);
                data[i]=((Math.random()*2-1)*0.6+Math.sin(t*120)*0.15)*env*0.8;}}
            return buf;}
          function stopPreview(){if(anim){cancelAnimationFrame(anim);anim=null;}
            try{if(src)src.stop();}catch(_){}try{if(liveCtx)liveCtx.close();}catch(_){}
            liveCtx=null;src=null;pan=null;isPlaying=false;drawBG();status('Stopped');}
          async function startPreview(){
            if(!buffer){alert('Please upload an audio file first.');return;}
            stopPreview();drawBG();isPlaying=false;
            try{
              liveCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:48000});
              src=liveCtx.createBufferSource();src.buffer=buffer;
              pan=liveCtx.createPanner();pan.panningModel='HRTF';
              pan.distanceModel='inverse';pan.refDistance=0.8;pan.maxDistance=8;
              const dry=liveCtx.createGain(),wide=liveCtx.createGain(),wet=liveCtx.createGain();
              const conv=liveCtx.createConvolver();conv.buffer=makeImpulse(liveCtx,2.4,2.8);
              const split=liveCtx.createChannelSplitter(2),merge=liveCtx.createChannelMerger(2);
              const dA=liveCtx.createDelay(0.045),dB=liveCtx.createDelay(0.045);
              dA.delayTime.value=0.045;dB.delayTime.value=0.045;
              src.connect(pan);pan.connect(dry);dry.connect(liveCtx.destination);
              pan.connect(split);split.connect(dA,0);split.connect(dB,1);
              dA.connect(merge,0,0);dB.connect(merge,0,1);merge.connect(wide);wide.connect(liveCtx.destination);
              pan.connect(conv);conv.connect(wet);wet.connect(liveCtx.destination);
              const ip=getCustomPosition();
              if('positionX'in pan){pan.positionX.value=ip.x;pan.positionY.value=ip.y;pan.positionZ.value=ip.z;}
              src.start();isPlaying=true;status('▶ Playing preview …');
              const st=liveCtx.currentTime,speed=Number(speedEl.value),depth=Number(depthEl.value);
              function loop(){
                if(!pan||!isPlaying){if(anim)cancelAnimationFrame(anim);return;}
                const t=liveCtx.currentTime-st;
                if(isCustom){const p=getCustomPosition();
                  if('positionX'in pan){pan.positionX.value=p.x;pan.positionY.value=p.y;pan.positionZ.value=p.z;}
                  drawPosition(p,'#60a5fa');
                }else{
                  const az=(t*360*0.14*speed)%360;
                  const el=Math.sin(t*0.55*speed)*(20*depth);
                  const rad=0.7*depth+Math.sin(t*0.45*speed)*(0.18*depth);
                  const p=sph(az,el,rad);
                  if('positionX'in pan){pan.positionX.value=p.x;pan.positionY.value=p.y;pan.positionZ.value=p.z;}
                  drawPosition(p,'#a78bfa');
                }
                const w=Number(widenEl.value);dry.gain.value=1-w;wide.gain.value=w;
                wet.gain.value=Number(reverbEl.value);
                anim=requestAnimationFrame(loop);
              }
              loop();
              src.onended=()=>{isPlaying=false;stopPreview();status('Preview ended');};
            }catch(err){status('Preview error: '+err.message);console.error(err);}
          }
          $('previewBtn').onclick=startPreview;
          $('stopBtn').onclick=stopPreview;

          $('renderBtn').onclick=async()=>{
            if(!buffer){alert('Upload an audio file first.');return;}
            const btn=$('renderBtn');btn.disabled=true;status('🎛 Rendering high-quality …');
            try{
              const ch=Math.max(2,buffer.numberOfChannels),sr=48000;
              const len=Math.ceil(buffer.duration*sr);
              const off=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(ch,len,sr);
              const s=off.createBufferSource();s.buffer=buffer;
              const p=off.createPanner();p.panningModel='HRTF';p.distanceModel='inverse';
              p.refDistance=0.8;p.maxDistance=8;
              const dry=off.createGain(),wide=off.createGain(),wet=off.createGain();
              const conv=off.createConvolver();conv.buffer=makeImpulse(off,2.4,2.8);
              const split=off.createChannelSplitter(2),merge=off.createChannelMerger(2);
              const dA=off.createDelay(0.045),dB=off.createDelay(0.045);
              dA.delayTime.value=0.045;dB.delayTime.value=0.045;
              s.connect(p);p.connect(dry);dry.connect(off.destination);
              p.connect(split);split.connect(dA,0);split.connect(dB,1);
              dA.connect(merge,0,0);dB.connect(merge,0,1);merge.connect(wide);wide.connect(off.destination);
              p.connect(conv);conv.connect(wet);wet.connect(off.destination);
              const dur=buffer.duration,steps=Math.max(2,Math.ceil(dur*90));
              const sp=Number(speedEl.value),dp=Number(depthEl.value);
              if(isCustom){
                const cp=getCustomPosition();
                if('positionX'in p){p.positionX.setValueAtTime(cp.x,0);
                  p.positionY.setValueAtTime(cp.y,0);p.positionZ.setValueAtTime(cp.z,0);}
              }else{
                for(let i=0;i<=steps;i++){
                  const t=(i/steps)*dur;
                  const az=(t*360*0.14*sp)%360;
                  const el=Math.sin(t*0.55*sp)*(20*dp);
                  const rad=0.7*dp+Math.sin(t*0.45*sp)*(0.18*dp);
                  const pos=sph(az,el,rad);
                  if('positionX'in p){p.positionX.setValueAtTime(pos.x,t);
                    p.positionY.setValueAtTime(pos.y,t);p.positionZ.setValueAtTime(pos.z,t);}
                }
              }
              const w=Number(widenEl.value);
              dry.gain.setValueAtTime(1-w,0);wide.gain.setValueAtTime(w,0);
              wet.gain.setValueAtTime(Number(reverbEl.value),0);
              s.start();
              const out=await off.startRendering();
              try{const mp3=await encodeMp3(out,320);makeDownloadLink(mp3,'mp3');
                status('✅ MP3 ready · 320kbps · '+out.duration.toFixed(1)+'s');
              }catch(mErr){console.warn('MP3 failed:',mErr);
                const wav=bufToWav(out);makeDownloadLink(wav,'wav');
                status('⚠️ MP3 failed · WAV fallback ready');}
            }catch(err){console.error(err);status('Render error: '+err.message);
              try{const wav=bufToWav(buffer);makeDownloadLink(wav,'wav');
                status('⚠️ Fallback · WAV ready');}catch(e2){status('Render failed: '+e2.message);}}
            btn.disabled=false;
          };
          function encodeMp3(buf,bitrate=320){return new Promise((res,rej)=>{
            try{
              if(typeof lamejs==='undefined')throw new Error('lamejs not loaded');
              const n=buf.numberOfChannels,sr=buf.sampleRate;
              const L=buf.getChannelData(0),R=n>1?buf.getChannelData(1):null;
              const enc=new lamejs.Mp3Encoder(R?2:1,sr,bitrate);
              const block=1152,parts=[];
              for(let i=0;i<L.length;i+=block){
                const ls=float16(L.subarray(i,i+block));
                const rs=R?float16(R.subarray(i,i+block)):null;
                const mp3=R?enc.encodeBuffer(ls,rs):enc.encodeBuffer(ls);
                if(mp3.length)parts.push(mp3);}
              const tail=enc.flush();if(tail.length)parts.push(tail);
              res(new Blob(parts,{type:'audio/mp3'}));
            }catch(e){rej(e);}});}
          function float16(f){const o=new Int16Array(f.length);
            for(let i=0;i<f.length;i++){let s=Math.max(-1,Math.min(1,f[i]));
              o[i]=s<0?s*0x8000:s*0x7FFF;}return o;}
          function bufToWav(buf){const n=buf.numberOfChannels,len=buf.length*n*2,sr=buf.sampleRate;
            const ab=new ArrayBuffer(44+len),v=new DataView(ab);let p=0;
            function w(s){for(let i=0;i<s.length;i++)v.setUint8(p++,s.charCodeAt(i));}
            w('RIFF');v.setUint32(p,36+len,true);p+=4;w('WAVEfmt ');v.setUint32(p,16,true);p+=4;
            v.setUint16(p,1,true);p+=2;v.setUint16(p,n,true);p+=2;v.setUint32(p,sr,true);p+=4;
            v.setUint32(p,sr*n*2,true);p+=4;v.setUint16(p,n*2,true);p+=2;v.setUint16(p,16,true);p+=2;
            w('data');v.setUint32(p,len,true);p+=4;
            const ch=[];for(let i=0;i<n;i++)ch.push(buf.getChannelData(i));
            let off=p;for(let i=0;i<buf.length;i++){for(let c=0;c<n;c++){
              let s=Math.max(-1,Math.min(1,ch[c][i]));
              v.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);off+=2;}}
            return new Blob([ab],{type:'audio/wav'});}
          function makeDownloadLink(blob,ext){downloadArea.innerHTML='';
            const a=document.createElement('a');a.href=URL.createObjectURL(blob);
            a.download='10d_output.'+ext;a.className='download-btn';
            const icon=ext==='mp3'?'🎵':'🎶';
            a.textContent=icon+' Download '+ext.toUpperCase()+' ('+(blob.size/1024).toFixed(0)+' KB)';
            downloadArea.appendChild(a);}

          // ═══════════════════════════════════════════════════════
          //            AUDIO PICKER (NEW FEATURE)
          // ═══════════════════════════════════════════════════════

          function formatDuration(ms){
            if(!ms||ms<0)return'';
            const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
            return h>0?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
                      :`${m}:${String(sec).padStart(2,'0')}`;
          }
          function escapeHtml(s){if(!s)return'';
            return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}
          function getFileIcon(name){
            if(!name)return'🎵';
            const n=name.toLowerCase();
            if(n.endsWith('.mp3'))return'🎵';
            if(n.endsWith('.wav'))return'🎶';
            if(n.endsWith('.ogg'))return'🎼';
            if(n.endsWith('.m4a')||n.endsWith('.aac'))return'🎧';
            if(n.endsWith('.flac'))return'💿';
            return'🎵';
          }
          function formatSize(bytes){
            if(!bytes)return'';
            if(bytes>1024*1024)return(bytes/1024/1024).toFixed(1)+' MB';
            return(bytes/1024).toFixed(0)+' KB';
          }

          function showPicker(){pickerModal.classList.add('show');}
          function hidePicker(){
            pickerScrollTop=pickerList.scrollTop;
            pickerModal.classList.remove('show');
          }

          function renderPickerList(songs){
            if(!songs.length){
              pickerList.innerHTML='<div class="picker-empty"><span class="emoji">🔍</span>No audio files found</div>';
              pickerCount.textContent='0 songs';return;
            }
            pickerCount.textContent=songs.length+' song'+(songs.length!==1?'s':'');
            const frag=document.createDocumentFragment();
            songs.forEach(song=>{
              const el=document.createElement('div');
              el.className='picker-item';
              el.dataset.id=song.id;
              el.dataset.uri=song.uri;
              const dur=formatDuration(song.duration);
              const size=song.size?formatSize(song.size):'';
              const meta=[song.artist,song.album,dur,size].filter(Boolean).join(' · ');
              el.innerHTML=`
                <div class="picker-item-icon">${getFileIcon(song.name)}</div>
                <div class="picker-item-info">
                  <div class="picker-item-name">${escapeHtml(song.title||song.name)}</div>
                  <div class="picker-item-meta">${escapeHtml(meta)}</div>
                </div>`;
              el.addEventListener('click',()=>onSongClick(song));
              frag.appendChild(el);
            });
            pickerList.innerHTML='';
            pickerList.appendChild(frag);
          }

          function onSongClick(song){
            hidePicker();
            // Give animation time to complete before starting load
            setTimeout(()=>{
              loadAudioFromUri(song.uri,song.title||song.name);
            },250);
          }

          // ── Fuzzy search ──
          function fuzzyScore(needle,hay){
            needle=needle.toLowerCase();hay=hay.toLowerCase();
            if(!needle)return 0;
            if(hay.includes(needle)){
              const idx=hay.indexOf(needle);
              return 1000-idx*0.5+(hay.length<50?100:0);
            }
            // subsequence fuzzy
            let qi=0,streak=0,bestStreak=0;
            for(let i=0;i<hay.length&&qi<needle.length;i++){
              if(hay[i]===needle[qi]){qi++;streak++;if(streak>bestStreak)bestStreak=streak;}
              else{streak=0;}
            }
            return qi===needle.length?bestStreak*15:0;
          }

          function performSearch(){
            const q=pickerSearch.value.trim();
            if(!q){renderPickerList(allSongs);pickerList.scrollTop=0;return;}
            const scored=[];
            for(const song of allSongs){
              const hay=(song.title||'')+' '+(song.name||'')+' '+(song.artist||'')+' '+(song.album||'');
              const s=fuzzyScore(q,hay);
              if(s>0)scored.push({song,score:s});
            }
            scored.sort((a,b)=>b.score-a.score);
            renderPickerList(scored.map(x=>x.song));
            pickerList.scrollTop=0;
          }

          // ── Permission handlers ──
          window.onStoragePermissionGranted=function(){
            status('✅ Permission granted — scanning…');
            scanAndShowPicker();
          };
          window.onStoragePermissionDenied=function(){
            status('⚠️ Permission denied');
            if(confirm('Storage permission is required to browse audio files.\nOpen settings to grant it?')){
              if(window.AndroidBridge&&AndroidBridge.openAppSettings)AndroidBridge.openAppSettings();
            }
          };

          async function scanAndShowPicker(){
            if(!window.AndroidBridge){
              // No native bridge — use system picker
              fileEl.click();
              return;
            }
            status('Scanning device for audio files…');
            pickerList.innerHTML='<div class="picker-empty"><span class="emoji">⏳</span>Scanning…</div>';
            pickerCount.textContent='0 songs';
            showPicker();
            // Defer heavy scan to next tick so modal animates first
            setTimeout(()=>{
              try{
                const json=AndroidBridge.getAudioFiles();
                allSongs=JSON.parse(json)||[];
              }catch(e){allSongs=[];console.error(e);}
              renderPickerList(allSongs);
              // Restore cached scroll position
              requestAnimationFrame(()=>{
                pickerList.scrollTop=pickerScrollTop;
              });
              status('Found '+allSongs.length+' audio file'+(allSongs.length!==1?'s':''));
            },50);
          }

          async function openPicker(){
            if(!window.AndroidBridge){
              // Web browser fallback
              fileEl.click();
              return;
            }
            if(!AndroidBridge.hasStoragePermission()){
              status('Requesting storage permission…');
              AndroidBridge.requestStoragePermission();
              return;
            }
            await scanAndShowPicker();
          }

          // ── Event bindings ──
          openPickerBtn.addEventListener('click',openPicker);
          pickerClose.addEventListener('click',hidePicker);
          pickerOverlay.addEventListener('click',hidePicker);
          pickerSearchBtn.addEventListener('click',performSearch);
          pickerSearch.addEventListener('input',()=>{
            // Live search with debounce
            clearTimeout(pickerSearch._t);
            pickerSearch._t=setTimeout(performSearch,180);
          });
          pickerSearch.addEventListener('keydown',e=>{
            if(e.key==='Enter'){e.preventDefault();performSearch();}
          });
          pickerSystem.addEventListener('click',()=>{
            hidePicker();
            setTimeout(()=>fileEl.click(),200);
          });
          document.addEventListener('keydown',e=>{
            if(e.key==='Escape'&&pickerModal.classList.contains('show'))hidePicker();
          });

          // ═══════════════════════════════════════════════════════
          status('ready · tap "Select Audio File"');
          drawBG();
          drawDot({x:0,y:0,z:0.8},'rgba(167,139,250,.3)');
          console.log('🎧 10D Audio Studio loaded — Made by AKASH');
          </script>
          </body>
          </html>
          HTML_CONTENT_EOF

