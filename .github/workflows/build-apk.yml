name: Build 10D Audio APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-licenses: 'true'

      - name: ⚙️ Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: 📂 Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/akash/audio10d
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

      - name: 📝 Write settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "10D Audio"
          include ':app'
          EOF

      - name: 📝 Write root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

      - name: 📝 Write gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.enableJetifier=true
          EOF

      - name: 📝 Write app/build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.akash.audio10d'
              compileSdk 34

              defaultConfig {
                  applicationId "com.akash.audio10d"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.9.0'
          }
          EOF

      - name: 📝 Write proguard-rules.pro
        run: |
          echo "# Empty proguard rules" > app/proguard-rules.pro

      - name: 📝 Write AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: 📝 Write strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">10D Audio</string>
          </resources>
          EOF

      - name: 📝 Write styles.xml
        run: |
          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

      - name: 📝 Write MainActivity.java
        run: |
          cat > app/src/main/java/com/akash/audio10d/MainActivity.java << 'EOF'
          package com.akash.audio10d;

          import android.annotation.SuppressLint;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private ActivityResultLauncher<Intent> fileChooserLauncher;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  );

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      getWindow().setStatusBarColor(0xFF000000);
                      getWindow().setNavigationBarColor(0xFF000000);
                  }

                  fileChooserLauncher = registerForActivityResult(
                      new ActivityResultContracts.StartActivityForResult(),
                      result -> {
                          if (filePathCallback == null) return;
                          Uri[] results = null;
                          if (result.getResultCode() == RESULT_OK && result.getData() != null) {
                              Intent data = result.getData();
                              if (data.getClipData() != null) {
                                  int count = data.getClipData().getItemCount();
                                  results = new Uri[count];
                                  for (int i = 0; i < count; i++) {
                                      results[i] = data.getClipData().getItemAt(i).getUri();
                                  }
                              } else if (data.getData() != null) {
                                  results = new Uri[]{ data.getData() };
                              }
                          }
                          filePathCallback.onReceiveValue(results);
                          filePathCallback = null;
                      }
                  );

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.JELLY_BEAN) {
                      s.setAllowFileAccessFromFileURLs(true);
                      s.setAllowUniversalAccessFromFileURLs(true);
                  }

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                              request.grant(request.getResources());
                          }
                      }

                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {

                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }
                          MainActivity.this.filePathCallback = filePathCallback;

                          Intent intent = fileChooserParams.createIntent();
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("audio/*");

                          try {
                              fileChooserLauncher.launch(intent);
                          } catch (Exception e) {
                              MainActivity.this.filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: 📝 Write index.html (Full 10D App)
        run: |
          cat > app/src/main/assets/index.html << 'HTML_CONTENT_EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
          <title>10D Audio Studio</title>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js" defer></script>
          <style>
          *{box-sizing:border-box}
          :root{--bg-1:#020b1a;--accent:#7c3aed;--accent-2:#a78bfa;
          --accent-glow:rgba(124,58,237,.35);--muted:#8ba3c7;--card-bg:rgba(255,255,255,.025);
          --border:rgba(255,255,255,.04);--radius:14px;
          --font:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif}
          html{font-size:15px}
          body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 30% 20%,#0b1a33,var(--bg-1) 80%);
          font-family:var(--font);color:#eaf3ff;display:flex;align-items:center;justify-content:center;padding:18px}
          .app{width:1040px;max-width:100%;border-radius:var(--radius);padding:20px 22px 14px;
          background:rgba(0,0,0,.45);backdrop-filter:blur(2px);border:1px solid var(--border);
          box-shadow:0 20px 60px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.02)}
          header{display:flex;gap:14px;align-items:center;justify-content:space-between;
          margin-bottom:14px;flex-wrap:wrap}
          .logo-group{display:flex;align-items:center;gap:12px}
          .logo{width:46px;height:46px;border-radius:12px;
          background:linear-gradient(145deg,var(--accent),var(--accent-2));display:grid;place-items:center;
          font-weight:800;font-size:19px;color:#fff;box-shadow:0 6px 22px var(--accent-glow)}
          .title-group h1{margin:0;font-size:19px;font-weight:700}
          .title-group .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
          .badge{font-size:12px;background:rgba(124,58,237,.18);padding:4px 14px;border-radius:40px;
          border:1px solid rgba(124,58,237,.15);color:var(--accent-2)}
          .main-grid{display:grid;grid-template-columns:1fr 340px;gap:18px}
          @media(max-width:820px){.main-grid{grid-template-columns:1fr}}
          .card{background:var(--card-bg);border-radius:var(--radius);padding:16px 18px;
          border:1px solid var(--border)}
          .card-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;
          margin:0 0 10px 0}
          .canvas-wrap{position:relative;border-radius:12px;overflow:hidden;
          background:radial-gradient(ellipse at center,#051828,#01080f);border:1px solid var(--border)}
          #vis{display:block;width:100%;height:260px;cursor:crosshair}
          .control-group{display:flex;flex-direction:column;gap:6px}
          .control-row{display:flex;align-items:center;gap:10px}
          .control-row label{font-size:12.5px;color:var(--muted);min-width:56px}
          .control-row input[type="range"]{flex:1;height:4px;-webkit-appearance:none;
          background:rgba(255,255,255,.08);border-radius:4px;outline:none}
          .control-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;
          width:16px;height:16px;border-radius:50%;
          background:linear-gradient(145deg,var(--accent),var(--accent-2));cursor:pointer;
          box-shadow:0 0 14px var(--accent-glow);border:2px solid rgba(255,255,255,.1)}
          .val{min-width:44px;text-align:right;font-size:13px;color:var(--muted)}
          .file-wrap{position:relative;margin-bottom:8px}
          .file-wrap input[type="file"]{width:100%;padding:10px 12px;
          border:1.5px dashed rgba(255,255,255,.08);border-radius:10px;background:rgba(0,0,0,.25);
          color:var(--muted);font-size:13px;cursor:pointer}
          .file-wrap input[type="file"]::file-selector-button{background:rgba(124,58,237,.2);
          border:0;padding:6px 16px;border-radius:8px;color:#fff;font-weight:600;font-size:12px;
          cursor:pointer;margin-right:12px}
          .btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
          button{border:0;border-radius:10px;padding:9px 18px;font-weight:700;font-size:13px;
          cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;
          font-family:var(--font)}
          .btn-primary{background:linear-gradient(145deg,var(--accent),var(--accent-2));color:#fff;
          box-shadow:0 4px 18px var(--accent-glow)}
          .btn-ghost{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted)}
          .btn-success{background:linear-gradient(145deg,#0ea5e9,#22d3ee);color:#001a1f}
          .custom-toggle{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.2);
          padding:8px 14px;border-radius:40px;border:1px solid var(--border);margin-bottom:6px;flex-wrap:wrap}
          .custom-toggle .label{font-size:13px;color:var(--muted)}
          .toggle-track{width:44px;height:24px;background:rgba(255,255,255,.08);border-radius:40px;
          cursor:pointer;position:relative;transition:.3s;flex-shrink:0}
          .toggle-track.active{background:var(--accent);box-shadow:0 0 20px var(--accent-glow)}
          .toggle-track .thumb{width:18px;height:18px;background:#fff;border-radius:50%;
          position:absolute;top:2px;left:2px;transition:.3s cubic-bezier(.34,1.56,.64,1)}
          .toggle-track.active .thumb{left:22px}
          .custom-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 12px;
          padding-top:6px;border-top:1px solid var(--border);margin-top:6px}
          .custom-controls .ctrl{display:flex;flex-direction:column;gap:2px}
          .custom-controls .ctrl label{font-size:11px;color:var(--muted)}
          .custom-controls .ctrl input[type="range"]{width:100%;height:3px;-webkit-appearance:none;
          background:rgba(255,255,255,.06);border-radius:4px;outline:none}
          .custom-controls .ctrl input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;
          width:14px;height:14px;border-radius:50%;background:var(--accent-2);cursor:pointer}
          .custom-controls .ctrl .cval{font-size:12px;color:var(--muted);text-align:center}
          #status{font-size:13px;color:var(--muted);padding:8px 12px;background:rgba(0,0,0,.2);
          border-radius:10px;border:1px solid var(--border);margin-top:6px;white-space:pre-wrap;
          min-height:38px;display:flex;align-items:center}
          #player{width:100%;margin-top:8px;border-radius:8px;background:rgba(0,0,0,.3);height:40px}
          .download-area{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
          .download-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;
          background:linear-gradient(145deg,#0ea5e9,#22d3ee);color:#001a1f;border-radius:10px;
          text-decoration:none;font-weight:700;font-size:13px}
          footer{text-align:center;color:var(--muted);font-size:12px;margin-top:14px;opacity:.5}
          .tips{font-size:13px;color:var(--muted);line-height:1.6}
          .tips ul{margin:4px 0 0 0;padding-left:18px}
          .tips .highlight{color:var(--accent-2);font-weight:600}
          </style>
          </head>
          <body>
          <div class="app">
          <header>
            <div class="logo-group">
              <div class="logo">10D</div>
              <div class="title-group">
                <h1>10D Audio Studio</h1>
                <div class="sub">Binaural · HRTF · High-Quality</div>
              </div>
            </div>
            <div class="badge">🎧 headphones required</div>
          </header>
          <div class="main-grid">
            <div>
              <div class="canvas-wrap"><canvas id="vis"></canvas></div>
              <div class="card" style="margin-top:12px">
                <div class="file-wrap">
                  <input id="file" type="file" accept="audio/*" />
                </div>
                <div class="control-group">
                  <div class="control-row"><label>Speed</label>
                  <input id="speed" type="range" min="0.1" max="2.5" step="0.01" value="0.7" />
                  <div class="val" id="speedVal">0.70×</div></div>
                  <div class="control-row"><label>Depth</label>
                  <input id="depth" type="range" min="0.1" max="2.0" step="0.01" value="1.0" />
                  <div class="val" id="depthVal">1.00</div></div>
                  <div class="control-row"><label>Widen</label>
                  <input id="widen" type="range" min="0" max="1" step="0.01" value="0.35" />
                  <div class="val" id="widenVal">0.35</div></div>
                  <div class="control-row"><label>Reverb</label>
                  <input id="reverb" type="range" min="0" max="1" step="0.01" value="0.22" />
                  <div class="val" id="reverbVal">0.22</div></div>
                </div>
                <div class="custom-toggle">
                  <span class="label">🎯 Custom Mode</span>
                  <div class="toggle-track" id="customToggle"><div class="thumb"></div></div>
                  <span style="font-size:12px;color:var(--muted);" id="customStatus">off</span>
                </div>
                <div id="customControls" style="display:none;">
                  <div class="custom-controls">
                    <div class="ctrl"><label>Azimuth °</label>
                    <input id="azimuth" type="range" min="-180" max="180" value="0" step="1" />
                    <div class="cval" id="azimuthVal">0°</div></div>
                    <div class="ctrl"><label>Elevation °</label>
                    <input id="elevation" type="range" min="-60" max="60" value="0" step="1" />
                    <div class="cval" id="elevationVal">0°</div></div>
                    <div class="ctrl"><label>Distance</label>
                    <input id="distance" type="range" min="0.1" max="2.5" value="1.0" step="0.05" />
                    <div class="cval" id="distanceVal">1.00</div></div>
                  </div>
                </div>
                <div class="btn-group">
                  <button id="previewBtn" class="btn-primary">▶ Preview</button>
                  <button id="stopBtn" class="btn-ghost">⏹ Stop</button>
                  <button id="renderBtn" class="btn-success">💾 Render</button>
                </div>
                <audio id="player" controls></audio>
                <div id="status">Status: ready</div>
                <div class="download-area" id="downloadArea"></div>
              </div>
            </div>
            <div class="card">
              <div class="card-title">⚡ Studio Tips</div>
              <div class="tips">
                <ul>
                  <li>Upload any audio file</li>
                  <li><span class="highlight">Custom Mode</span> — manual position control</li>
                  <li>Click on canvas to set position</li>
                  <li>Render exports <span class="highlight">320kbps MP3</span></li>
                  <li style="margin-top:8px;opacity:.6;">Made by AKASH · 10D v2</li>
                </ul>
              </div>
            </div>
          </div>
          <footer>© 10D Audio Tool — binaural spatial audio</footer>
          </div>
          <script>
          const $=id=>document.getElementById(id);
          const fileEl=$('file'),player=$('player'),statusEl=$('status');
          const speedEl=$('speed'),depthEl=$('depth'),widenEl=$('widen'),reverbEl=$('reverb');
          const speedVal=$('speedVal'),depthVal=$('depthVal'),widenVal=$('widenVal'),reverbVal=$('reverbVal');
          const vis=$('vis'),downloadArea=$('downloadArea');
          const customToggle=$('customToggle'),customStatus=$('customStatus'),customControls=$('customControls');
          const azimuthEl=$('azimuth'),elevationEl=$('elevation'),distanceEl=$('distance');
          const azimuthVal=$('azimuthVal'),elevationVal=$('elevationVal'),distanceVal=$('distanceVal');
          let buffer=null,liveCtx=null,src=null,pan=null,anim=null,isCustom=false,isPlaying=false;
          function status(s){statusEl.textContent='Status: '+s;}
          function updateVals(){
            speedVal.textContent=Number(speedEl.value).toFixed(2)+'×';
            depthVal.textContent=Number(depthEl.value).toFixed(2);
            widenVal.textContent=Number(widenEl.value).toFixed(2);
            reverbVal.textContent=Number(reverbEl.value).toFixed(2);
          }
          speedEl.oninput=depthEl.oninput=widenEl.oninput=reverbEl.oninput=updateVals;updateVals();
          function updateCustomVals(){
            azimuthVal.textContent=Number(azimuthEl.value).toFixed(0)+'°';
            elevationVal.textContent=Number(elevationEl.value).toFixed(0)+'°';
            distanceVal.textContent=Number(distanceEl.value).toFixed(2);
          }
          azimuthEl.oninput=elevationEl.oninput=distanceEl.oninput=updateCustomVals;updateCustomVals();
          customToggle.addEventListener('click',()=>{
            isCustom=!isCustom;
            customToggle.classList.toggle('active',isCustom);
            customStatus.textContent=isCustom?'on':'off';
            customControls.style.display=isCustom?'block':'none';
            if(isPlaying&&pan)updatePanFromCustom();
          });
          function sph(az,el,d){const A=az*Math.PI/180,E=el*Math.PI/180;
            return{x:d*Math.cos(E)*Math.sin(A),y:d*Math.sin(E),z:d*Math.cos(E)*Math.cos(A)};}
          const ctx=vis.getContext('2d');let W,H,dpr;
          function resize(){const r=vis.getBoundingClientRect();dpr=devicePixelRatio||1;
            W=r.width;H=r.height;vis.width=W*dpr;vis.height=H*dpr;
            ctx.setTransform(dpr,0,0,dpr,0,0);drawBG();}
          window.addEventListener('resize',resize);
          function drawBG(){ctx.fillStyle='#01080f';ctx.fillRect(0,0,W,H);
            ctx.strokeStyle='rgba(255,255,255,.02)';ctx.lineWidth=0.5;
            for(let i=0;i<10;i++){const x=(i/10)*W;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
              const y=(i/10)*H;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
            ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;ctx.setLineDash([4,6]);
            ctx.beginPath();ctx.arc(W/2,H/2,Math.min(W,H)*0.28,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}
          function proj(p){const s=Math.min(W,H)*0.55;
            return{x:W/2+p.x*s,y:H/2-p.y*s*0.85-p.z*12,r:5+(1-Math.min(1,p.z*0.5))*7};}
          function drawDot(p,color){const d=proj(p);
            const grad=ctx.createRadialGradient(d.x-3,d.y-3,2,d.x,d.y,d.r+10);
            grad.addColorStop(0,color||'#a78bfa');grad.addColorStop(0.7,color||'#7c3aed');
            grad.addColorStop(1,'rgba(124,58,237,0)');
            ctx.shadowColor='rgba(124,58,237,.4)';ctx.shadowBlur=28;
            ctx.beginPath();ctx.arc(d.x,d.y,d.r+6,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();
            ctx.shadowBlur=0;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();}
          function drawPosition(p,color){drawBG();drawDot(p,color);}
          resize();
          vis.addEventListener('click',(e)=>{
            if(!isCustom||!isPlaying)return;
            const r=vis.getBoundingClientRect();
            const mx=(e.clientX-r.left)/W*2-1,my=-(e.clientY-r.top)/H*2+1;
            const az=Math.max(-180,Math.min(180,mx*180));
            const el=Math.max(-60,Math.min(60,my*60));
            azimuthEl.value=az;elevationEl.value=el;updateCustomVals();updatePanFromCustom();
            const p=getCustomPosition();drawPosition(p,'#60a5fa');
          });
          function getCustomPosition(){return sph(Number(azimuthEl.value),Number(elevationEl.value),Number(distanceEl.value));}
          function updatePanFromCustom(){if(!pan)return;const p=getCustomPosition();
            if('positionX'in pan){pan.positionX.value=p.x;pan.positionY.value=p.y;pan.positionZ.value=p.z;}
            drawPosition(p,'#60a5fa');}
          fileEl.onchange=async e=>{
            const f=e.target.files[0];if(!f)return;status('Decoding …');
            try{const ab=await f.arrayBuffer();
              const c=new (window.AudioContext||window.webkitAudioContext)({sampleRate:48000});
              buffer=await c.decodeAudioData(ab.slice(0));await c.close();
              player.src=URL.createObjectURL(f);
              status('Loaded: '+f.name+' | '+buffer.duration.toFixed(1)+'s');
            }catch(err){status('Decode error: '+err.message);}
          };
          function makeImpulse(c,dur=2.4,decay=2.8){const sr=c.sampleRate||48000;
            const len=Math.floor(sr*dur),buf=c.createBuffer(2,len,sr);
            for(let ch=0;ch<2;ch++){const data=buf.getChannelData(ch);
              for(let i=0;i<len;i++){const t=i/sr,env=Math.pow(1-t/dur,decay);
                data[i]=((Math.random()*2-1)*0.6+Math.sin(t*120)*0.15)*env*0.8;}}
            return buf;}
          function stopPreview(){if(anim){cancelAnimationFrame(anim);anim=null;}
            try{if(src)src.stop();}catch(_){}try{if(liveCtx)liveCtx.close();}catch(_){}
            liveCtx=null;src=null;pan=null;isPlaying=false;drawBG();status('Stopped');}
          async function startPreview(){
            if(!buffer){alert('Please upload an audio file first.');return;}
            stopPreview();drawBG();isPlaying=false;
            try{
              liveCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:48000});
              src=liveCtx.createBufferSource();src.buffer=buffer;
              pan=liveCtx.createPanner();pan.panningModel='HRTF';
              pan.distanceModel='inverse';pan.refDistance=0.8;pan.maxDistance=8;
              const dry=liveCtx.createGain(),wide=liveCtx.createGain(),wet=liveCtx.createGain();
              const conv=liveCtx.createConvolver();conv.buffer=makeImpulse(liveCtx,2.4,2.8);
              const split=liveCtx.createChannelSplitter(2),merge=liveCtx.createChannelMerger(2);
              const dA=liveCtx.createDelay(0.045),dB=liveCtx.createDelay(0.045);
              dA.delayTime.value=0.045;dB.delayTime.value=0.045;
              src.connect(pan);pan.connect(dry);dry.connect(liveCtx.destination);
              pan.connect(split);split.connect(dA,0);split.connect(dB,1);
              dA.connect(merge,0,0);dB.connect(merge,0,1);merge.connect(wide);wide.connect(liveCtx.destination);
              pan.connect(conv);conv.connect(wet);wet.connect(liveCtx.destination);
              const ip=getCustomPosition();
              if('positionX'in pan){pan.positionX.value=ip.x;pan.positionY.value=ip.y;pan.positionZ.value=ip.z;}
              src.start();isPlaying=true;status('▶ Playing preview …');
              const st=liveCtx.currentTime,speed=Number(speedEl.value),depth=Number(depthEl.value);
              function loop(){
                if(!pan||!isPlaying){if(anim)cancelAnimationFrame(anim);return;}
                const t=liveCtx.currentTime-st;
                if(isCustom){const p=getCustomPosition();
                  if('positionX'in pan){pan.positionX.value=p.x;pan.positionY.value=p.y;pan.positionZ.value=p.z;}
                  drawPosition(p,'#60a5fa');
                }else{
                  const az=(t*360*0.14*speed)%360;
                  const el=Math.sin(t*0.55*speed)*(20*depth);
                  const rad=0.7*depth+Math.sin(t*0.45*speed)*(0.18*depth);
                  const p=sph(az,el,rad);
                  if('positionX'in pan){pan.positionX.value=p.x;pan.positionY.value=p.y;pan.positionZ.value=p.z;}
                  drawPosition(p,'#a78bfa');
                }
                const w=Number(widenEl.value);dry.gain.value=1-w;wide.gain.value=w;
                wet.gain.value=Number(reverbEl.value);
                anim=requestAnimationFrame(loop);
              }
              loop();
              src.onended=()=>{isPlaying=false;stopPreview();status('Preview ended');};
            }catch(err){status('Preview error: '+err.message);console.error(err);}
          }
          $('previewBtn').onclick=startPreview;
          $('stopBtn').onclick=stopPreview;
          $('renderBtn').onclick=async()=>{
            if(!buffer){alert('Upload an audio file first.');return;}
            const btn=$('renderBtn');btn.disabled=true;status('🎛 Rendering high-quality …');
            try{
              const ch=Math.max(2,buffer.numberOfChannels),sr=48000;
              const len=Math.ceil(buffer.duration*sr);
              const off=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(ch,len,sr);
              const s=off.createBufferSource();s.buffer=buffer;
              const p=off.createPanner();p.panningModel='HRTF';p.distanceModel='inverse';
              p.refDistance=0.8;p.maxDistance=8;
              const dry=off.createGain(),wide=off.createGain(),wet=off.createGain();
              const conv=off.createConvolver();conv.buffer=makeImpulse(off,2.4,2.8);
              const split=off.createChannelSplitter(2),merge=off.createChannelMerger(2);
              const dA=off.createDelay(0.045),dB=off.createDelay(0.045);
              dA.delayTime.value=0.045;dB.delayTime.value=0.045;
              s.connect(p);p.connect(dry);dry.connect(off.destination);
              p.connect(split);split.connect(dA,0);split.connect(dB,1);
              dA.connect(merge,0,0);dB.connect(merge,0,1);merge.connect(wide);wide.connect(off.destination);
              p.connect(conv);conv.connect(wet);wet.connect(off.destination);
              const dur=buffer.duration,steps=Math.max(2,Math.ceil(dur*90));
              const sp=Number(speedEl.value),dp=Number(depthEl.value);
              if(isCustom){
                const cp=getCustomPosition();
                if('positionX'in p){p.positionX.setValueAtTime(cp.x,0);
                  p.positionY.setValueAtTime(cp.y,0);p.positionZ.setValueAtTime(cp.z,0);}
              }else{
                for(let i=0;i<=steps;i++){
                  const t=(i/steps)*dur;
                  const az=(t*360*0.14*sp)%360;
                  const el=Math.sin(t*0.55*sp)*(20*dp);
                  const rad=0.7*dp+Math.sin(t*0.45*sp)*(0.18*dp);
                  const pos=sph(az,el,rad);
                  if('positionX'in p){p.positionX.setValueAtTime(pos.x,t);
                    p.positionY.setValueAtTime(pos.y,t);p.positionZ.setValueAtTime(pos.z,t);}
                }
              }
              const w=Number(widenEl.value);
              dry.gain.setValueAtTime(1-w,0);wide.gain.setValueAtTime(w,0);
              wet.gain.setValueAtTime(Number(reverbEl.value),0);
              s.start();
              const out=await off.startRendering();
              try{const mp3=await encodeMp3(out,320);makeDownloadLink(mp3,'mp3');
                status('✅ MP3 ready · 320kbps · '+out.duration.toFixed(1)+'s');
              }catch(mErr){console.warn('MP3 failed:',mErr);
                const wav=bufToWav(out);makeDownloadLink(wav,'wav');
                status('⚠️ MP3 failed · WAV fallback ready');}
            }catch(err){console.error(err);status('Render error: '+err.message);
              try{const wav=bufToWav(buffer);makeDownloadLink(wav,'wav');
                status('⚠️ Fallback · WAV ready');}catch(e2){status('Render failed: '+e2.message);}}
            btn.disabled=false;
          };
          function encodeMp3(buf,bitrate=320){return new Promise((res,rej)=>{
            try{
              if(typeof lamejs==='undefined')throw new Error('lamejs not loaded');
              const n=buf.numberOfChannels,sr=buf.sampleRate;
              const L=buf.getChannelData(0),R=n>1?buf.getChannelData(1):null;
              const enc=new lamejs.Mp3Encoder(R?2:1,sr,bitrate);
              const block=1152,parts=[];
              for(let i=0;i<L.length;i+=block){
                const ls=float16(L.subarray(i,i+block));
                const rs=R?float16(R.subarray(i,i+block)):null;
                const mp3=R?enc.encodeBuffer(ls,rs):enc.encodeBuffer(ls);
                if(mp3.length)parts.push(mp3);}
              const tail=enc.flush();if(tail.length)parts.push(tail);
              res(new Blob(parts,{type:'audio/mp3'}));
            }catch(e){rej(e);}});}
          function float16(f){const o=new Int16Array(f.length);
            for(let i=0;i<f.length;i++){let s=Math.max(-1,Math.min(1,f[i]));
              o[i]=s<0?s*0x8000:s*0x7FFF;}return o;}
          function bufToWav(buf){const n=buf.numberOfChannels,len=buf.length*n*2,sr=buf.sampleRate;
            const ab=new ArrayBuffer(44+len),v=new DataView(ab);let p=0;
            function w(s){for(let i=0;i<s.length;i++)v.setUint8(p++,s.charCodeAt(i));}
            w('RIFF');v.setUint32(p,36+len,true);p+=4;w('WAVEfmt ');v.setUint32(p,16,true);p+=4;
            v.setUint16(p,1,true);p+=2;v.setUint16(p,n,true);p+=2;v.setUint32(p,sr,true);p+=4;
            v.setUint32(p,sr*n*2,true);p+=4;v.setUint16(p,n*2,true);p+=2;v.setUint16(p,16,true);p+=2;
            w('data');v.setUint32(p,len,true);p+=4;
            const ch=[];for(let i=0;i<n;i++)ch.push(buf.getChannelData(i));
            let off=p;for(let i=0;i<buf.length;i++){for(let c=0;c<n;c++){
              let s=Math.max(-1,Math.min(1,ch[c][i]));
              v.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);off+=2;}}
            return new Blob([ab],{type:'audio/wav'});}
          function makeDownloadLink(blob,ext){downloadArea.innerHTML='';
            const a=document.createElement('a');a.href=URL.createObjectURL(blob);
            a.download='10d_output.'+ext;a.className='download-btn';
            const icon=ext==='mp3'?'🎵':'🎶';
            a.textContent=icon+' Download '+ext.toUpperCase()+' ('+(blob.size/1024).toFixed(0)+' KB)';
            downloadArea.appendChild(a);}
          status('ready · upload audio');drawBG();
          drawDot({x:0,y:0,z:0.8},'rgba(167,139,250,.3)');
          </script>
          </body>
          </html>
          HTML_CONTENT_EOF

      - name: 🔨 Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 10D-Audio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: ✅ Show APK Info
        run: |
          echo "✅ APK built successfully!"
          ls -lh app/build/outputs/apk/debug/
